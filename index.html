*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Poppins,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}

main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:12px 14px 110px}

.grid div{background:#fff;color:#000;padding:8px;border-radius:10px;font-size:13px;text-align:center}
